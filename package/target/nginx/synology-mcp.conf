# Included in DSM's own web server (ports 5000/5001): the Synology MCP window reaches the package's
# daemon here, with the administrator's DSM session (checked by the daemon with authenticate.cgi).
location ^~ /synology-mcp/api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
    access_log off;
}
